services:
  db:
    image: postgres:15.5
    container_name: jobpilot_db
    restart: unless-stopped
    # Resource limits: stop one container from hogging the whole machine / heating it.
    cpus: 0.5
    mem_limit: 512m
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 5

  ollama:
    image: ollama/ollama:latest
    container_name: jobpilot_ollama
    restart: unless-stopped
    cpus: 2.0
    mem_limit: 2g
    environment:
      # A single-user local tool: process one generation at a time, load only one
      # model, and unload it a few minutes after a request so idle RAM is freed
      # (less heat/lag between runs).
      OLLAMA_NUM_PARALLEL: "1"
      OLLAMA_MAX_LOADED_MODELS: "1"
      # Load the model from disk only when a cover letter is requested, then drop
      # it back to disk 30s after the last request. Keeps the 1.5B model OUT of RAM
      # during scrape/apply (it's only resident during the letter phase) so the
      # browser and the LLM are never both eating RAM at once.
      OLLAMA_KEEP_ALIVE: "30s"
    volumes:
      - ollama_data:/root/.ollama
    ports:
      - "11434:11434"

  backend:
    # Builds the React frontend AND the FastAPI backend into ONE image (see
    # docker/backend.Dockerfile). Context is the repo root so the multi-stage
    # build can reach both ./frontend and ./backend.
    build:
      context: .
      dockerfile: docker/backend.Dockerfile
    container_name: jobpilot_backend
    restart: unless-stopped
    # Now runs ONE Chromium at a time (scrape + apply), so ~600-800MB peak.
    # Sized for an 8GB box with ~5.3GB usable: keeps the OS + Postgres headroom.
    cpus: 2.0
    mem_limit: 1.5g
    depends_on:
      db:
        condition: service_healthy
      ollama:
        condition: service_started
    environment:
      DATABASE_URL: postgresql://${DB_USER}:${DB_PASSWORD}@db:5432/${DB_NAME}
      ENVIRONMENT: ${ENVIRONMENT}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://ollama:11434}
    env_file:
      - .env
    volumes:
      # Source bind-mount removed in favour of a baked image (production).
      # Only the resumes directory (user data) is persisted.
      - ./backend/resumes:/app/resumes
    # Serves the React app + /api on one port (no nginx). Host :80 -> container
    # :8000, so you still open http://localhost exactly as before.
    ports:
      - "80:8000"

volumes:
  postgres_data:
  ollama_data: